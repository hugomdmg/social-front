<div id="container" *ngIf="receivedData">
    <div id="head">
        <p>{{receivedData.user2_name}}</p>
        <button (click)="closeChat()">x</button>
    </div>
    <div id="messages">
        <div *ngFor="let message of messages" [ngClass]="{'user1': message.sender_id == user, 'user2': message.sender_id != user}" >
            <p>{{message.text}}</p>
        </div>
    </div>
    <form [formGroup]="chat" (submit)="sendMessage()">
        <input type="text" formControlName="message">
        <button type="submit">send</button>
    </form>
</div>
